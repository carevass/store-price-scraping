services:
  orchestration:
    container_name: etl_orchestration
    image: apache/airflow:latest
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
      #- /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      #This removes login for the airflow UI
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
      _AIRFLOW_DB_MIGRATE: 'true'
      AIRFLOW_CONN_SCRAPING_CONTAINER: http://scraping_api:6060
      #AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      #_AIRFLOW_WWW_USER_CREATE: 'true'
      #_AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME:-airflow}
      #_AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD:-airflow}
    restart: unless-stopped
    networks:
      - scraping

  scrapers-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./scrapers/Dockerfile
    container_name: scraping_api
    image: supermarket_scraping:latest
    volumes:
      - ./scrapers:/app
      - .env:/app/.env
    networks:
      - scraping
    ports:
      - "6060:6060"
    entrypoint: ["uvicorn", "scripts.api_server:app", "--host", "0.0.0.0", "--port", "6060"]

  scrapers-dev:
    build:
      context: .
      dockerfile: ./scrapers/Dockerfile
    container_name: supermarket_scraping
    image: supermarket_scraping:latest
    volumes:
      - ./scrapers:/app
      - .env:/app/.env
    networks:
      - scraping
    #these ports are just so I can connect the scraper service to my local spyder to run scripts from there.
    #same with the command below, these can me removed if not using spyder.
    ports:
      - "6000:6000"
      - "6001:6001"
      - "6002:6002"
      - "6005:6005"
      - "6004:6004"

    command: >
      sh -c "rm -f /tmp/kernel.json /app/kernel.json &&
      python -m spyder_kernels.console
      --ip=0.0.0.0
      --shell=6000
      --iopub=6001
      --stdin=6002
      --control=6005
      --hb=6004
      -f=/tmp/kernel.json &
      while [ ! -s /tmp/kernel.json ]; do sleep 0.5; done &&
      sleep 0.5 &&
      sed 's/0.0.0.0/127.0.0.1/g' /tmp/kernel.json > /app/kernel.json &&
      wait"


  scraping_db:
    restart: unless-stopped
    image: postgres:latest
    container_name: scraping_data
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    networks:
      - scraping
    ports:
      - "2286:5432"
    volumes:
      - ./scraping_db/init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql

  superset:
    build: ./superset
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    networks:
      - scraping
    volumes:
      - ./scrapers/scripts/env_vars.py:/app/pythonpath/env_vars.py
      - ./.env:/app/pythonpath/.env
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    depends_on:
      - scraping_db
    restart: unless-stopped
networks:
  scraping:
volumes:
  postgres_data:
